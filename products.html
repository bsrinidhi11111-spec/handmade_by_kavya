<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Collection | Handmade by Kavya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="index.html" class="brand">

            <span class="brand-icon">✿</span>

            <div>
                <strong>Handmade by Kavya</strong>
                <small>Made with Love</small>
            </div>

        </a>


        <nav class="main-nav">

            <a href="index.html">Home</a>

            <a href="products.html">Shop</a>

            <a href="cart.html">
                Cart
                <span id="cartCount">0</span>
            </a>

        </nav>

    </div>

</header>


<main class="shop-page">

<div class="container">

    <!-- PAGE TITLE -->

    <div class="shop-heading">

        <span class="section-label">
            HANDMADE COLLECTION
        </span>

        <h1>Our Collection</h1>

        <p>
            Beautiful handmade accessories,
            created with love.
        </p>

    </div>


    <!-- SEARCH + CATEGORY -->

    <div class="shop-controls">

        <input
            type="search"
            id="searchInput"
            placeholder="Search products..."
            oninput="displayProducts()"
        >


        <select
            id="categoryFilter"
            onchange="displayProducts()"
        >

            <option value="All">
                All Categories
            </option>

            <option value="Bangles">
                Bangles
            </option>

            <option value="Earrings">
                Earrings
            </option>

            <option value="Hair Accessories">
                Hair Accessories
            </option>

        </select>

    </div>


    <!-- PRODUCTS -->

    <div
        id="productsContainer"
        class="product-grid"
    ></div>

</div>

</main>


<footer class="site-footer">

    <div class="container">

        <div class="footer-brand">

            <span>✿</span>

            <strong>
                Handmade by Kavya
            </strong>

        </div>

        <p>
            Handmade accessories crafted with love.
        </p>


        <p class="copyright">
            © 2026 Handmade by Kavya.
            All rights reserved.
        </p>

    </div>

</footer>


<script src="script.js"></script>


<script>

/* =========================================
   GET PRODUCTS
========================================= */

function getProducts() {

    return JSON.parse(
        localStorage.getItem(
            "handmadeKavyaProducts"
        )
    ) || [];

}


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function displayProducts() {

    const container =
        document.getElementById(
            "productsContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const products =
        getProducts();


    const filteredProducts =
        products.filter(product => {

            const matchesSearch =
                product.name
                    .toLowerCase()
                    .includes(search);


            const matchesCategory =
                category === "All" ||
                product.category === category;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    /* NO PRODUCTS */

    if (filteredProducts.length === 0) {

        container.innerHTML = `

            <div
                class="no-products"
                style="grid-column:1/-1;"
            >

                <div class="no-products-icon">
                    ✿
                </div>

                <h3>
                    No Products Found
                </h3>

                <p>
                    ${
                        products.length === 0
                        ? "Products added by you will appear here."
                        : "Try another search or category."
                    }
                </p>

            </div>

        `;

        return;

    }


    /* PRODUCT CARDS */

    container.innerHTML =
        filteredProducts
        .map(product => {

            const isOutOfStock =
                Number(product.stock) <= 0;


            return `

                <div class="product-card">


                    <div class="product-image">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                    </div>


                    <div class="product-info">


                        <div class="product-category">

                            ${product.category}

                        </div>


                        <h3>

                            ${product.name}

                        </h3>


                        ${
                            product.description
                            ? `
                                <p style="
                                    font-size:13px;
                                    color:#806a64;
                                    margin-top:5px;
                                ">
                                    ${product.description}
                                </p>
                              `
                            : ""
                        }


                        <div class="product-price">

                            ₹${Number(
                                product.price
                            ).toFixed(2)}

                        </div>


                        ${
                            isOutOfStock

                            ?

                            `
                            <div class="out-of-stock">
                                Out of Stock
                            </div>
                            `

                            :

                            `
                            <button
                                class="btn btn-primary"
                                onclick="
                                    addProductToCart(
                                        '${product.id}'
                                    )
                                "
                            >
                                Add to Cart
                            </button>
                            `
                        }

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================
   ADD PRODUCT TO CART
========================================= */

function addProductToCart(productId) {

    const products =
        getProducts();


    const product =
        products.find(
            item =>
                item.id === productId
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    if (Number(product.stock) <= 0) {

        alert(
            "This product is out of stock."
        );

        return;

    }


    addToCart({

        id: product.id,

        name: product.name,

        price: Number(product.price),

        image: product.image,

        quantity: 1

    });


    alert(
        product.name +
        " added to cart!"
    );


    updateCartCount();

}


/* =========================================
   CATEGORY FROM URL
========================================= */

function checkCategoryFromURL() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const category =
        params.get("category");


    if (!category) return;


    const select =
        document.getElementById(
            "categoryFilter"
        );


    if (
        [
            "Bangles",
            "Earrings",
            "Hair Accessories"
        ].includes(category)
    ) {

        select.value = category;

    }

}


/* =========================================
   START
========================================= */

checkCategoryFromURL();

displayProducts();

updateCartCount();

</script>

</body>
</html>
